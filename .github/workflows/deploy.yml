name: Deploy Lucky Dental React Frontend to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend for GitHub Pages
        run: |
          cd frontend
          npm run build
        env:
          VITE_BASE: /duannhakhoademowebapp/

      - name: Copy index.html to 404.html
        run: |
          cp frontend/dist/index.html frontend/dist/404.html

      - name: Deploy to GitHub Pages Branch (gh-pages)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: frontend/dist
          branch: gh-pages
